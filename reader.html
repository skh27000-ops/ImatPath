<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading — ImatPath</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=3">
<link rel="shortcut icon" href="favicon.ico?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="auth-guard.js"></script>
<style>
:root{--ink:#1B1340;--ink2:#4A4270;--grape:#6C3BFF;--sun:#FFC83D;--mint:#27D3A2;--cream:#FFF8EA;--lav:#EDE6FF}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--ink);font-family:Figtree,Arial,sans-serif;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:3px solid var(--ink)}
.back{display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--ink);border-radius:99px;padding:8px 14px;font-weight:800;font-size:.9rem;color:var(--ink);text-decoration:none;background:#fff}
.ttl{flex:1;min-width:180px}
.ttl b{display:block;font:800 1.05rem 'Bricolage Grotesque',Arial,sans-serif;letter-spacing:-.01em}
.ttl span{font-size:.8rem;color:var(--ink2);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--ink);border-radius:99px;padding:8px 16px;font:800 .9rem Figtree,Arial,sans-serif;cursor:pointer;text-decoration:none;color:var(--ink);background:#fff}
.btn.pri{background:var(--grape);color:#fff}
.btn.done{background:var(--mint)}
.btn:focus-visible,.back:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.view{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.fallback{display:none;max-width:460px;margin:34px auto;padding:22px;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:5px 6px 0 var(--ink);text-align:center}
.fallback h2{margin:0 0 8px;font:800 1.3rem 'Bricolage Grotesque',Arial,sans-serif}
.fallback p{margin:0 0 16px;color:var(--ink2);line-height:1.5}
.fallback .btn{justify-content:center;width:100%;margin-top:8px}
.mobile iframe{display:none}.mobile .fallback{display:block}
</style>
</head>
<body>
<div class="bar">
  <a class="back" id="back" href="lessons.html">← Lessons</a>
  <div class="ttl"><b id="t">Course document</b><span id="sub"></span></div>
  <a class="btn" id="dl" download>Download PDF</a>
  <button class="btn pri" id="done" type="button">Mark as read</button>
</div>
<div class="view" id="view">
  <iframe id="f" title="Course document"></iframe>
  <div class="fallback">
    <h2>Open the lesson</h2>
    <p>Phones show one page at a time inside other pages. For the best reading, open the PDF directly. Come back afterwards to mark it as read.</p>
    <a class="btn pri" id="open" target="_blank" rel="noopener">Open the PDF</a>
  </div>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var doc=q.get('doc')||'';
  // only our own documents
  if(!/^docs\/[a-z0-9_\-\/]+\.pdf$/i.test(doc)){location.replace('lessons.html');return;}
  var title=q.get('t')||'Course document',n=q.get('n'),of=q.get('of'),subj=q.get('s')||'';
  document.title=title+' — ImatPath';
  document.getElementById('t').textContent=title;
  document.getElementById('sub').textContent=(subj?subj+' · ':'')+(n&&of?'Lesson '+n+' of '+of:'Course document');
  if(subj)document.getElementById('back').href='lessons.html#'+subj.toLowerCase();
  var dl=document.getElementById('dl'),op=document.getElementById('open'),f=document.getElementById('f');
  var isLocal=location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  var mobile=window.innerWidth<760||/iPhone|iPad|Android/i.test(navigator.userAgent);
  if(mobile)document.getElementById('view').classList.add('mobile');
  var fname=title.replace(/[^\w\- ]+/g,'').trim()||'ImatPath document';
  function show(href){
    dl.href=href;dl.setAttribute('download','ImatPath - '+fname+'.pdf');op.href=href;
    if(!mobile)f.src=href+'#view=FitH';
  }
  function fail(msg){
    var v=document.getElementById('view');v.classList.add('mobile');
    v.querySelector('.fallback h2').textContent='Cannot open this document';
    v.querySelector('.fallback p').textContent=msg;
    op.textContent='Back to lessons';op.removeAttribute('target');op.href='lessons.html';
    dl.style.display='none';
  }
  if(isLocal){show(doc);}
  else{
    // course documents are only served to signed-in accounts, so fetch with the session token
    (async function(){
      try{
        var ses=window.ImatAuth&&await window.ImatAuth.getSession();
        if(!ses){location.replace('auth.html');return;}
        var r=await fetch(doc,{headers:{Authorization:'Bearer '+ses.access_token}});
        if(r.status===403){location.replace('access.html');return;}
        if(!r.ok)throw new Error(r.status);
        show(URL.createObjectURL(await r.blob()));
      }catch(e){fail('Check your connection and try again. If it keeps happening, sign out and sign in again.');}
    })();
  }
  function get(){try{return JSON.parse(localStorage.getItem('ip_docs_read_v1')||'{}')}catch(e){return {}}}
  function set(m){try{localStorage.setItem('ip_docs_read_v1',JSON.stringify(m))}catch(e){}}
  var btn=document.getElementById('done');
  function paint(){var r=!!get()[doc];btn.textContent=r?'✓ Read':'Mark as read';btn.classList.toggle('done',r);btn.classList.toggle('pri',!r);btn.setAttribute('aria-pressed',r)}
  btn.addEventListener('click',function(){var m=get();if(m[doc])delete m[doc];else m[doc]=Date.now();set(m);paint()});
  paint();
})();
</script>
</body>
</html>
