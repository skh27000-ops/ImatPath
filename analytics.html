<style>
:root{
  --cream:#f6f1e6; --cream-2:#efe7d5; --card:#fffdf7;
  --ink:#152720; --ink-soft:#42574d;
  --g900:#0a241b; --g800:#0e2f23; --g700:#164534; --g600:#1e5b44;
  --terra:#c1591f; --terra-d:#a84a15;
  --gold:#d9a441; --gold-l:#e9c070;
  --line:#e2d8c2; --line-d:#23443a;
  --ok:#2e7d4f; --bad:#b3402e;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,-apple-system,sans-serif;
  --sh-sm:0 1px 2px rgba(21,39,32,.06),0 4px 14px rgba(21,39,32,.06);
  --sh-md:0 2px 6px rgba(21,39,32,.08),0 14px 34px rgba(21,39,32,.10);
}

[data-theme="dark"] {
  --cream: #111714; --cream-2: #191f1c; --card: #1a211d;
  --ink: #e2ddd3; --ink-soft: #a4b3a9;
  --line: #2a3530; --line-d: #2a3530;
  --g900: #0a0e0c; --g800: #0f1613;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;transition:background 0.3s, color 0.3s;}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
svg{display:block}
::selection{background:var(--terra);color:#fff}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.15;letter-spacing:-.01em}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,164,65,.5)}50%{box-shadow:0 0 0 6px rgba(217,164,65,0)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

/* ============ SIDEBAR ============ */
.sidebar{position:fixed;inset:0 auto 0 0;width:264px;background:var(--g900);color:var(--cream);display:flex;flex-direction:column;z-index:60;transition:transform .35s ease}
.logo{display:flex;align-items:center;font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em;padding:26px 26px 22px;color:var(--cream)}
.logo em{font-style:italic;color:var(--gold-l)}
.sb-nav{display:flex;flex-direction:column;gap:4px;padding:6px 14px}
.sb-nav a{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:12px;font-size:14.5px;font-weight:500;color:#9db3a5;position:relative;transition:.2s}
.sb-nav a svg{flex:none;opacity:.85}
.sb-nav a:hover{color:var(--cream);background:rgba(246,241,230,.06)}
.sb-nav a.active{color:var(--cream);background:rgba(217,164,65,.12);font-weight:600}
.sb-nav a.active::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--gold)}
.sb-spacer{flex:1}

.access-card{margin:0 16px 14px;padding:16px 18px;border:1px solid rgba(217,164,65,.45);border-radius:16px;background:linear-gradient(150deg,rgba(217,164,65,.14),rgba(217,164,65,.04));position:relative;overflow:hidden;cursor:pointer;transition:transform .2s;}
.access-card:hover{transform:translateY(-2px);}
.access-card::after{content:"";position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(217,164,65,.25),transparent 70%)}
.access-card .ac-l{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-l);display:flex;align-items:center;gap:7px;margin-bottom:6px}
.access-card .ac-l i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}
.access-card b{font-family:var(--serif);font-size:16.5px;font-weight:600;display:block;color:var(--cream)}
.access-card span{font-size:12px;color:#9db3a5}

.user-row{display:flex;align-items:center;gap:12px;padding:16px 20px;border-top:1px solid var(--line-d)}
.avatar{width:38px;height:38px;border-radius:12px;background:var(--g700);border:1.5px solid var(--line-d);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--gold-l)}
.user-row .u-t{flex:1;min-width:0}
.user-row .u-t b{display:block;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-row .u-t small{font-size:11.5px;color:#8fa897}
.logout{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:#8fa897;transition:.2s;cursor:pointer;}
.logout:hover{color:#ff9c7a;background:rgba(179,64,46,.15)}

/* ============ MAIN ============ */
.main{margin-left:264px;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:rgba(246,241,230,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:18px 36px;display:flex;align-items:center;justify-content:space-between;gap:18px;transition:background 0.3s, border-color 0.3s;}
[data-theme="dark"] .topbar { background: rgba(17,23,20,.85); }
.burger{display:none;flex-direction:column;gap:5px;padding:8px;margin-right:4px}
.burger span{width:22px;height:2px;background:var(--ink);border-radius:2px}
.topbar h1{font-size:clamp(1.3rem,2.2vw,1.7rem)}
.topbar p{font-size:13px;color:var(--ink-soft);max-width:520px}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.date-chip{font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);padding:8px 15px;border-radius:999px}
.count-chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;background:var(--g800);color:var(--cream);padding:8px 16px;border-radius:999px;white-space:nowrap}
.count-chip b{color:var(--gold-l);font-family:var(--serif);font-size:15px}
.count-chip .fl{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}

.nav-dark-toggle{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:14px;transition:.25s;cursor:pointer;}
.nav-dark-toggle:hover{border-color:var(--terra);color:var(--terra)}
[data-theme="dark"] .nav-dark-toggle{border-color:var(--line);color:var(--gold)}

.content-container{padding:32px 36px 60px;max-width:1160px;width:100%;margin:0 auto}

/* ============ KPI ROW ============ */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));gap:14px;margin-bottom:28px;}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:4px;transition:transform .2s;}
.kpi:hover{transform:translateY(-3px);}
.kpi-val{font-family:var(--serif);font-size:36px;font-weight:600;line-height:1;color:var(--ink);}
.kpi-lbl{font-size:13px;font-weight:700;color:var(--ink);margin-top:6px;}
.kpi-sub{font-size:11.5px;color:var(--ink-soft);}

/* ============ CARDS & GRIDS ============ */
.analytics-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-bottom:26px;}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--sh-sm);}
.panel-title{font-size:18px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:10px;margin-bottom:20px;}

.score-predictor-card{background:var(--g900);color:var(--cream);border-radius:22px;padding:32px;box-shadow:var(--sh-md);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:18px;}
.score-predictor-card::before{content:"";position:absolute;inset:0;background:radial-gradient(340px 220px at 90% -20%,rgba(217,164,65,.25),transparent 65%);}
.sp-badge{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l);background:rgba(217,164,65,.15);padding:4px 12px;border-radius:99px;display:inline-block;}
.sp-score{font-family:var(--serif);font-size:68px;font-weight:600;line-height:1;color:var(--cream);margin:8px 0;}
.sp-score span{font-size:22px;color:#9db3a5;font-family:var(--sans);}

/* ============ SUBJECT CARDS ============ */
.subj-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:16px;}
.sc{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:20px;transition:.2s;}
.sc:hover{border-color:var(--terra);transform:translateY(-2px);}
.sc-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.sc-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:16px;background:rgba(193,89,31,.1);color:var(--terra);}
.sc-name{font-size:15px;font-weight:700;color:var(--ink);}
.sc-sec{font-size:11px;color:var(--ink-soft);text-transform:uppercase;font-weight:700;letter-spacing:.05em;}
.sc-stats{display:flex;justify-content:space-between;margin-bottom:12px;font-size:13px;}
.sc-bar{height:6px;background:var(--cream-2);border-radius:99px;overflow:hidden;border:1px solid var(--line);}
.sc-fill{height:100%;background:linear-gradient(90deg,var(--g600),var(--terra));border-radius:99px;transition:width .8s ease;}

/* ============ TIPS & SCORING ============ */
.tip-item{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--cream);margin-bottom:10px;font-size:13.5px;}
.tip-item i{color:var(--gold);margin-top:2px;font-size:15px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:600;font-size:14.5px;padding:13px 26px;border-radius:999px;transition:.2s}
.btn-primary{background:var(--terra);color:#fff;box-shadow:0 6px 18px rgba(193,89,31,.3)}
.btn-primary:hover{background:var(--terra-d);transform:translateY(-2px)}
.btn-line{border:1.5px solid var(--line);color:var(--ink-soft);background:var(--card)}
.btn-line:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-2px)}

.overlay{position:fixed;inset:0;background:rgba(10,36,27,.5);z-index:55;opacity:0;pointer-events:none;transition:.3s}
.overlay.show{opacity:1;pointer-events:auto}

@media(max-width:960px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .main{margin-left:0}
  .burger{display:flex}
  .topbar{padding:16px 20px}
  .content-container{padding:22px 20px 40px}
  .analytics-grid{grid-template-columns:1fr;}
}
</style>
</head>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));

/* ── Dark Mode Toggle & Sync ── */
window.toggleDarkMode = function() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('imatpath_dark_mode', 'false');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('imatpath_dark_mode', 'true');
  }
  updateDarkIcon();
};

function updateDarkIcon() {
  const btn = $('#navDarkToggle');
  if (btn) {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    btn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
  }
}
document.addEventListener('DOMContentLoaded', updateDarkIcon);

/* ── Logout Handler ── */
window.handleLogout = async function(e) {
  if (e) e.preventDefault();
  if (window.ImatAuth) {
    await window.ImatAuth.signOut();
  } else {
    localStorage.removeItem('imatpath_user');
    window.location.href = 'auth.html';
  }
};

/* ── Sidebar Mobile ── */
const sb=$("#sidebar"), ov=$("#overlay");
if ($("#burger")) $("#burger").addEventListener("click",()=>{sb.classList.add("open");ov.classList.add("show");});
if (ov) ov.addEventListener("click",()=>{sb.classList.remove("open");ov.classList.remove("show");});

/* ── Today & Countdown ── */
if ($("#todayChip")) {
  $("#todayChip").textContent = new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
}
const examDate = new Date("2026-09-29T09:00:00");
const diffDays = Math.max(0, Math.ceil((examDate - new Date()) / 864e5));
if ($("#daysChip")) $("#daysChip").textContent = diffDays;

const SUBJECTS = [
  {id:'critical-thinking', name:'Critical Thinking', section:'Section 1', icon:'fa-brain', total:84},
  {id:'problem-solving',   name:'Problem Solving',  section:'Section 1', icon:'fa-puzzle-piece', total:77},
  {id:'data-analysis',     name:'Data Analysis',    section:'Section 1', icon:'fa-chart-bar', total:100},
  {id:'biology',           name:'Biology',           section:'Section 2', icon:'fa-dna', total:744},
  {id:'chemistry',         name:'Chemistry',         section:'Section 3', icon:'fa-flask', total:351},
  {id:'physics',           name:'Physics',            section:'Section 4', icon:'fa-atom', total:306},
  {id:'maths',             name:'Mathematics',        section:'Section 4', icon:'fa-square-root-variable', total:335}
];

const IMAT_CORRECT = 1.5;
const IMAT_WRONG = -0.4;
const TOTAL_QUESTIONS_POOL = 2000;

function getQBData(){
  const saved = localStorage.getItem('imatpath_qb');
  const rev = (saved ? JSON.parse(saved).revealed : {}) || {};
  let totalAttempted = Object.keys(rev).length;
  let totalCorrectStored = parseInt(localStorage.getItem('imatpath_qb_correct') || '0');

  const bySubject = {};
  SUBJECTS.forEach(sub => {
    let sAttempted = 0;
    for(let i=0; i<sub.total; i++){
      const k = sub.id + '-' + i;
      if(rev[k]) sAttempted++;
    }
    const ratio = totalAttempted > 0 ? (totalCorrectStored / totalAttempted) : 0;
    const sCorrect = Math.round(sAttempted * ratio);
    bySubject[sub.id] = { attempted: sAttempted, correct: sCorrect, wrong: sAttempted - sCorrect, total: sub.total };
  });

  return { attempted: totalAttempted, correct: totalCorrectStored, wrong: Math.max(0, totalAttempted - totalCorrectStored), bySubject };
}

function renderAnalytics() {
  const data = getQBData();
  const content = $('#analyticsContent');
  if (!content) return;

  const acc = data.attempted > 0 ? Math.round((data.correct / data.attempted) * 100) : 0;
  const xpState = (typeof XP !== 'undefined') ? XP.getState() : { streak: 0, longestStreak: 0, level: 1 };
  
  // Calculate predicted IMAT Score
  const predictedScore = Math.max(0, Math.min(90, Math.round((data.correct * IMAT_CORRECT + data.wrong * IMAT_WRONG) * 10) / 10));

  content.innerHTML = `
    <!-- 1 · KPI CARDS -->
    <div class="kpi-row">
      <div class="kpi">
        <div class="kpi-val">${data.attempted}</div>
        <div class="kpi-lbl">Questions Attempted</div>
        <div class="kpi-sub">${Math.round((data.attempted / TOTAL_QUESTIONS_POOL) * 100)}% of 2,000+ pool</div>
      </div>
      <div class="kpi">
        <div class="kpi-val" style="color:var(--terra)">${acc}%</div>
        <div class="kpi-lbl">Overall Accuracy</div>
        <div class="kpi-sub">${data.correct} correct &middot; ${data.wrong} incorrect</div>
      </div>
      <div class="kpi">
        <div class="kpi-val" style="color:var(--gold)">${xpState.streak} 🔥</div>
        <div class="kpi-lbl">Day Streak</div>
        <div class="kpi-sub">Best: ${xpState.longestStreak} days</div>
      </div>
      <div class="kpi">
        <div class="kpi-val">Lv.${xpState.level}</div>
        <div class="kpi-lbl">XP Study Level</div>
        <div class="kpi-sub">+10 XP per correct answer</div>
      </div>
    </div>

    <!-- 2 · SCORE PREDICTOR & STRATEGY -->
    <div class="analytics-grid">
      <div class="score-predictor-card">
        <div>
          <span class="sp-badge"><i class="fas fa-calculator"></i> IMAT Score Predictor</span>
          <div class="sp-score">${predictedScore} <span>/ 90.0</span></div>
          <p style="color:#c3d2c6;font-size:14px;line-height:1.5;">Based on your current question accuracy and official +1.5 / −0.4 scoring formula.</p>
        </div>
        <div style="display:flex;gap:12px;padding-top:14px;border-top:1px solid var(--line-d);font-size:13px;color:#9db3a5">
          <span><b>+${(data.correct * 1.5).toFixed(1)}</b> points earned</span>
          <span>&middot;</span>
          <span><b>${(data.wrong * -0.4).toFixed(1)}</b> penalty</span>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title"><i class="fas fa-lightbulb" style="color:var(--gold)"></i> Preparation Strategy</div>
        <div class="tip-item">
          <i class="fas fa-check-circle"></i>
          <div><b>Focus on Negative Marking:</b> Leaving an uncertain question blank avoids the −0.4 penalty. Only guess if you can eliminate at least 2 options.</div>
        </div>
        <div class="tip-item">
          <i class="fas fa-dna"></i>
          <div><b>High-Yield Focus:</b> Biology and Chemistry make up over 50% of the total score. Prioritize chapter mastery in Section 2 & 3.</div>
        </div>
      </div>
    </div>

    <!-- 3 · SUBJECT BREAKDOWN -->
    <div class="panel" style="margin-top:20px;">
      <div class="panel-title"><i class="fas fa-chart-pie" style="color:var(--terra)"></i> Subject Mastery Breakdown</div>
      <div class="subj-grid">
        ${SUBJECTS.map(sub => {
          const st = data.bySubject[sub.id] || { attempted: 0, correct: 0, total: sub.total };
          const sAcc = st.attempted > 0 ? Math.round((st.correct / st.attempted) * 100) : 0;
          const progPct = Math.round((st.attempted / sub.total) * 100);
          return `
            <div class="sc">
              <div class="sc-top">
                <div class="sc-icon"><i class="fas ${sub.icon}"></i></div>
                <div>
                  <div class="sc-name">${sub.name}</div>
                  <div class="sc-sec">${sub.section}</div>
                </div>
              </div>
              <div class="sc-stats">
                <span><b>${st.attempted}</b> / ${sub.total} questions</span>
                <span>Accuracy: <b style="color:var(--terra)">${sAcc}%</b></span>
              </div>
              <div class="sc-bar"><div class="sc-fill" style="width:${progPct}%"></div></div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

renderAnalytics();

})();
</script>
</body>
</html>
