<style>
:root{
  --cream:#f6f1e6; --cream-2:#efe7d5; --card:#fffdf7;
  --ink:#152720; --ink-soft:#42574d;
  --g900:#0a241b; --g800:#0e2f23; --g700:#164534; --g600:#1e5b44;
  --terra:#c1591f; --terra-d:#a84a15;
  --gold:#d9a441; --gold-l:#e9c070;
  --line:#e2d8c2; --line-d:#23443a;
  --ok:#2e7d4f; --bad:#b3402e;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,-apple-system,sans-serif;
  --sh-sm:0 1px 2px rgba(21,39,32,.06),0 4px 14px rgba(21,39,32,.06);
  --sh-md:0 2px 6px rgba(21,39,32,.08),0 14px 34px rgba(21,39,32,.10);
}

[data-theme="dark"] {
  --cream: #111714; --cream-2: #191f1c; --card: #1a211d;
  --ink: #e2ddd3; --ink-soft: #a4b3a9;
  --line: #2a3530; --line-d: #2a3530;
  --g900: #0a0e0c; --g800: #0f1613;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;transition:background 0.3s, color 0.3s;}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
svg{display:block}
::selection{background:var(--terra);color:#fff}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.15;letter-spacing:-.01em}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,164,65,.5)}50%{box-shadow:0 0 0 6px rgba(217,164,65,0)}}
@keyframes pulseT{0%,100%{box-shadow:0 0 0 0 rgba(193,89,31,.45)}50%{box-shadow:0 0 0 7px rgba(193,89,31,0)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

/* ============ SIDEBAR ============ */
.sidebar{position:fixed;inset:0 auto 0 0;width:264px;background:var(--g900);color:var(--cream);display:flex;flex-direction:column;z-index:60;transition:transform .35s ease}
.logo{display:flex;align-items:center;font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em;padding:26px 26px 22px;color:var(--cream)}
.logo em{font-style:italic;color:var(--gold-l)}
.sb-nav{display:flex;flex-direction:column;gap:4px;padding:6px 14px}
.sb-nav a{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:12px;font-size:14.5px;font-weight:500;color:#9db3a5;position:relative;transition:.2s}
.sb-nav a svg{flex:none;opacity:.85}
.sb-nav a:hover{color:var(--cream);background:rgba(246,241,230,.06)}
.sb-nav a.active{color:var(--cream);background:rgba(217,164,65,.12);font-weight:600}
.sb-nav a.active::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--gold)}
.sb-spacer{flex:1}

.access-card{margin:0 16px 14px;padding:16px 18px;border:1px solid rgba(217,164,65,.45);border-radius:16px;background:linear-gradient(150deg,rgba(217,164,65,.14),rgba(217,164,65,.04));position:relative;overflow:hidden;cursor:pointer;transition:transform .2s;}
.access-card:hover{transform:translateY(-2px);}
.access-card::after{content:"";position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(217,164,65,.25),transparent 70%)}
.access-card .ac-l{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-l);display:flex;align-items:center;gap:7px;margin-bottom:6px}
.access-card .ac-l i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}
.access-card b{font-family:var(--serif);font-size:16.5px;font-weight:600;display:block;color:var(--cream)}
.access-card span{font-size:12px;color:#9db3a5}

.user-row{display:flex;align-items:center;gap:12px;padding:16px 20px;border-top:1px solid var(--line-d)}
.avatar{width:38px;height:38px;border-radius:12px;background:var(--g700);border:1.5px solid var(--line-d);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--gold-l)}
.user-row .u-t{flex:1;min-width:0}
.user-row .u-t b{display:block;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-row .u-t small{font-size:11.5px;color:#8fa897}
.logout{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:#8fa897;transition:.2s;cursor:pointer;}
.logout:hover{color:#ff9c7a;background:rgba(179,64,46,.15)}

/* ============ MAIN ============ */
.main{margin-left:264px;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:rgba(246,241,230,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:18px 36px;display:flex;align-items:center;justify-content:space-between;gap:18px;transition:background 0.3s, border-color 0.3s;}
[data-theme="dark"] .topbar { background: rgba(17,23,20,.85); }
.burger{display:none;flex-direction:column;gap:5px;padding:8px;margin-right:4px}
.burger span{width:22px;height:2px;background:var(--ink);border-radius:2px}
.topbar h1{font-size:clamp(1.3rem,2.2vw,1.7rem)}
.topbar p{font-size:13px;color:var(--ink-soft);max-width:520px}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.date-chip{font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);padding:8px 15px;border-radius:999px}
.count-chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;background:var(--g800);color:var(--cream);padding:8px 16px;border-radius:999px;white-space:nowrap}
.count-chip b{color:var(--gold-l);font-family:var(--serif);font-size:15px}
.count-chip .fl{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}

.nav-dark-toggle{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:14px;transition:.25s;cursor:pointer;}
.nav-dark-toggle:hover{border-color:var(--terra);color:var(--terra)}
[data-theme="dark"] .nav-dark-toggle{border-color:var(--line);color:var(--gold)}

.content-container{padding:32px 36px 60px;max-width:1160px;width:100%;margin:0 auto}

/* ============ BUTTONS & CARDS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:600;font-size:14.5px;padding:13px 26px;border-radius:999px;transition:.2s}
.btn-primary{background:var(--terra);color:#fff;box-shadow:0 6px 18px rgba(193,89,31,.3)}
.btn-primary:hover{background:var(--terra-d);transform:translateY(-2px)}
.btn-line{border:1.5px solid var(--line);color:var(--ink-soft);background:var(--card)}
.btn-line:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-2px)}
.btn-danger-line{border:1.5px solid rgba(179,64,46,.4);color:var(--bad);background:var(--card)}
.btn-danger-line:hover{background:rgba(179,64,46,.08)}

/* ============ PAPERS GRID ============ */
.papers-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));gap:18px;margin-top:24px;}
.paper-card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--sh-sm);cursor:pointer;transition:transform .28s, box-shadow .28s, border-color .28s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;}
.paper-card:hover{transform:translateY(-5px);border-color:var(--terra);box-shadow:var(--sh-md);}
.paper-top{display:flex;align-items:center;justify-content:space-between;}
.paper-tag{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:rgba(217,164,65,.16);color:#8a6413;padding:4px 10px;border-radius:99px;}
[data-theme="dark"] .paper-tag{color:var(--gold-l);background:rgba(217,164,65,.15);}
.paper-card h3{font-size:22px;color:var(--ink);}
.paper-card p{font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
.paper-meta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);}
.paper-cta{color:var(--terra);font-weight:700;display:inline-flex;align-items:center;gap:6px;}

/* ============ EXAM INTERFACE ============ */
.exam-hud{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:var(--sh-sm);margin-bottom:20px;}
.timer-chip{font-family:var(--serif);font-size:24px;font-weight:600;background:var(--g800);color:var(--gold-l);padding:6px 18px;border-radius:12px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:10px;}
.timer-chip.warning{color:#ff9c7a;animation:pulse 1s infinite;}
.hud-title{font-size:13.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;}
.hud-progress{font-size:14px;font-weight:600;color:var(--ink);}

.q-box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:var(--sh-sm);margin-bottom:22px;}
.q-sub-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--terra);}
.q-passage{background:var(--cream-2);border:1px solid var(--line);border-radius:14px;padding:18px 22px;font-size:14.5px;line-height:1.7;color:var(--ink);margin-bottom:20px;}
.q-text{font-size:18px;font-weight:600;line-height:1.5;color:var(--ink);margin-bottom:22px;font-family:var(--serif);}
.q-opts{display:grid;gap:10px;}
.q-opt{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:var(--cream);font-size:15px;font-weight:500;text-align:left;color:var(--ink);transition:.2s;}
.q-opt:hover:not(:disabled){border-color:var(--terra);transform:translateX(3px);}
.q-opt.selected{border-color:var(--terra);background:rgba(193,89,31,.08);color:var(--terra-d);}
[data-theme="dark"] .q-opt.selected{color:var(--gold-l);}
.q-opt-letter{flex:none;width:30px;height:30px;border-radius:9px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--ink-soft);}
.q-opt.selected .q-opt-letter{background:var(--terra);border-color:var(--terra);color:#fff;}
.q-opt.correct{border-color:var(--ok);background:rgba(46,125,79,.1);}
.q-opt.correct .q-opt-letter{background:var(--ok);border-color:var(--ok);color:#fff;}
.q-opt.wrong{border-color:var(--bad);background:rgba(179,64,46,.1);}
.q-opt.wrong .q-opt-letter{background:var(--bad);border-color:var(--bad);color:#fff;}

.q-nav-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:20px;}
.nav-grid-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:28px;}
.nav-grid-title{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:14px;}
.nav-pills{display:grid;grid-template-columns:repeat(auto-fill, minmax(42px, 1fr));gap:8px;}
.nav-pill{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);font-size:13px;font-weight:700;display:grid;place-items:center;cursor:pointer;transition:.2s;color:var(--ink);}
.nav-pill:hover{border-color:var(--terra);}
.nav-pill.current{border-color:var(--terra);background:var(--terra);color:#fff;}
.nav-pill.answered{border-color:rgba(46,125,79,.6);background:rgba(46,125,79,.12);color:var(--ok);}

/* ============ RESULTS ============ */
.results-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px;box-shadow:var(--sh-md);text-align:center;max-width:760px;margin:0 auto;}
.res-score{font-family:var(--serif);font-size:76px;font-weight:600;line-height:1;color:var(--ink);margin:12px 0 4px;}
.res-score span{font-size:24px;color:var(--ink-soft);}
.res-kpi-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:14px;margin:28px 0;}
.res-kpi{background:var(--cream-2);border:1px solid var(--line);border-radius:16px;padding:16px;}
.res-kpi b{font-family:var(--serif);font-size:26px;display:block;color:var(--ink);}
.res-kpi span{font-size:12px;color:var(--ink-soft);text-transform:uppercase;font-weight:700;letter-spacing:.05em;}

.breakdown-list{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;text-align:left;padding-right:8px;margin-top:20px;}
.bd-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--cream);font-size:13.5px;}
.bd-icon{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex-shrink:0;}
.bd-icon.ok{background:rgba(46,125,79,.15);color:var(--ok);}
.bd-icon.fail{background:rgba(179,64,46,.15);color:var(--bad);}
.bd-icon.skip{background:var(--cream-2);color:var(--ink-soft);}



.overlay{position:fixed;inset:0;background:rgba(10,36,27,.5);z-index:55;opacity:0;pointer-events:none;transition:.3s}
.overlay.show{opacity:1;pointer-events:auto}

@media(max-width:960px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .main{margin-left:0}
  .burger{display:flex}
  .topbar{padding:16px 20px}
  .content-container{padding:22px 20px 40px}
  .papers-grid{grid-template-columns:1fr;}
}
</style>
</head>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));

/* ── Dark Mode Toggle & Sync ── */
window.toggleDarkMode = function() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('imatpath_dark_mode', 'false');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('imatpath_dark_mode', 'true');
  }
  updateDarkIcon();
};

function updateDarkIcon() {
  const btn = $('#navDarkToggle');
  if (btn) {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    btn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
  }
}
document.addEventListener('DOMContentLoaded', updateDarkIcon);

/* ── Logout Handler ── */
window.handleLogout = async function(e) {
  if (e) e.preventDefault();
  if (window.ImatAuth) {
    await window.ImatAuth.signOut();
  } else {
    localStorage.removeItem('imatpath_user');
    window.location.href = 'auth.html';
  }
};

/* ── Sidebar Mobile ── */
const sb=$("#sidebar"), ov=$("#overlay");
if ($("#burger")) $("#burger").addEventListener("click",()=>{sb.classList.add("open");ov.classList.add("show");});
if (ov) ov.addEventListener("click",()=>{sb.classList.remove("open");ov.classList.remove("show");});

/* ── Today & Countdown ── */
if ($("#todayChip")) {
  $("#todayChip").textContent = new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
}
const examDate = new Date("2026-09-29T09:00:00");
const diffDays = Math.max(0, Math.ceil((examDate - new Date()) / 864e5));
if ($("#daysChip")) $("#daysChip").textContent = diffDays;

/* ── Scoring & Constants ── */
const IMAT_CORRECT = 1.5;
const IMAT_WRONG = -0.4;
const EXAM_DURATION_MINUTES = 100;
const QUESTIONS_PER_EXAM = 60;

let state = {
  view: 'select-exam',
  selectedExamId: null,
  timer: null,
  timeRemaining: EXAM_DURATION_MINUTES * 60,
  currentQuestion: 0,
  answers: {},
  examQuestions: []
};

function loadState(){
  const saved = localStorage.getItem('imatpath_mock');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
    } catch(e) {}
  }
  if (state.view === 'exam' || state.view === 'results') {
    state.view = 'select-exam';
    state.selectedExamId = null;
    state.answers = {};
    state.examQuestions = [];
    state.currentQuestion = 0;
    state.timeRemaining = EXAM_DURATION_MINUTES * 60;
  }
}
function saveState(){ localStorage.setItem('imatpath_mock', JSON.stringify(state)); }
loadState();

function formatTime(seconds){
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
}

window.selectExam = function(examId) {
  state.selectedExamId = examId;
  state.view = 'setup';
  state.answers = {};
  state.examQuestions = [];
  state.currentQuestion = 0;
  state.timeRemaining = EXAM_DURATION_MINUTES * 60;
  saveState();
  render();
};

window.startExam = function() {
  if (!confirm('Start 100-minute timed simulation? The timer runs continuously.')) return;
  if (typeof pastPapersData === 'undefined' || !pastPapersData[state.selectedExamId]) {
    alert('Questions for this past paper are loading or unavailable.');
    return;
  }
  state.examQuestions = pastPapersData[state.selectedExamId];
  state.view = 'exam';
  state.timeRemaining = EXAM_DURATION_MINUTES * 60;
  state.currentQuestion = 0;
  state.answers = {};
  saveState();
  startTimer();
  render();
};

function startTimer() {
  if (state.timer) clearInterval(state.timer);
  state.timer = setInterval(() => {
    state.timeRemaining--;
    if (state.timeRemaining <= 0) {
      clearInterval(state.timer);
      submitExam();
    }
    saveState();
    const timerEls = $$('.timer-val');
    timerEls.forEach(el => {
      el.textContent = formatTime(state.timeRemaining);
      if (state.timeRemaining < 300) el.parentElement.classList.add('warning');
    });
  }, 1000);
}

window.selectAnswer = function(qIdx, optIdx) {
  state.answers[qIdx] = optIdx;
  saveState();
  render();
};

window.nextQuestion = function() {
  if (state.currentQuestion < state.examQuestions.length - 1) {
    state.currentQuestion++;
    saveState();
    render();
  }
};

window.prevQuestion = function() {
  if (state.currentQuestion > 0) {
    state.currentQuestion--;
    saveState();
    render();
  }
};

window.jumpTo = function(idx) {
  state.currentQuestion = idx;
  saveState();
  render();
};

window.submitExam = function() {
  clearInterval(state.timer);
  state.view = 'results';
  saveState();
  const score = calculateScore();
  if (window.ImatAuth) {
    window.ImatAuth.saveMockResult('past-' + state.selectedExamId, score);
  }
  if (typeof XP !== 'undefined') setTimeout(() => XP.award('mock'), 500);
  render();
};

function calculateScore() {
  let correct = 0, wrong = 0, unanswered = 0, score = 0;
  state.examQuestions.forEach((q, i) => {
    const ans = state.answers[i];
    if (ans === undefined) unanswered++;
    else if (ans === q.correct) { correct++; score += IMAT_CORRECT; }
    else { wrong++; score += IMAT_WRONG; }
  });
  return { correct, wrong, unanswered, score: score.toFixed(1) };
}

window.goBack = function() {
  clearInterval(state.timer);
  state.view = 'select-exam';
  saveState();
  render();
};

window.quitExam = function() {
  if (confirm('Quit exam simulation? Your current progress will be lost.')) {
    clearInterval(state.timer);
    state.selectedExamId = null;
    state.view = 'select-exam';
    state.answers = {};
    state.examQuestions = [];
    state.currentQuestion = 0;
    saveState();
    render();
  }
};

window.startReview = function() {
  state.view = 'review';
  state.currentQuestion = 0;
  saveState();
  render();
};

/* ── Renderers ── */
function render() {
  const app = $('#app');
  if (!app) return;
  if (state.view === 'select-exam') app.innerHTML = renderSelectExam();
  else if (state.view === 'setup') app.innerHTML = renderSetup();
  else if (state.view === 'exam') app.innerHTML = renderExam();
  else if (state.view === 'results') app.innerHTML = renderResults();
  else if (state.view === 'review') app.innerHTML = renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderSelectExam() {
  return `
    <div style="animation:fadeInUp .5s ease">
      <span style="font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);display:block;margin-bottom:6px">Official Cambridge & MUR Papers</span>
      <h2>Official IMAT Past Papers</h2>
      <p style="color:var(--ink-soft);font-size:14.5px;max-width:600px;margin-bottom:24px;">Practice with real official IMAT papers under timed simulation conditions (+1.5 / −0.4 scoring).</p>
      
      <div class="papers-grid">
        <div class="paper-card" onclick="selectExam('2025')">
          <div class="paper-top"><span class="paper-tag">Official MUR</span><span style="font-size:12px;color:var(--ink-soft);font-weight:600">60 Questions</span></div>
          <h3>IMAT 2025 Past Paper</h3>
          <p>The latest official exam with full detailed explanations and syllabus coverage.</p>
          <div class="paper-meta"><span>100 Minutes &middot; Real Scoring</span><span class="paper-cta">Start Paper <i class="fas fa-arrow-right"></i></span></div>
        </div>

        <div class="paper-card" onclick="selectExam('2024')">
          <div class="paper-top"><span class="paper-tag">Official MUR</span><span style="font-size:12px;color:var(--ink-soft);font-weight:600">60 Questions</span></div>
          <h3>IMAT 2024 Past Paper</h3>
          <p>Official 2024 exam covering Section 1, Biology, Chemistry, Physics & Mathematics.</p>
          <div class="paper-meta"><span>100 Minutes &middot; Real Scoring</span><span class="paper-cta">Start Paper <i class="fas fa-arrow-right"></i></span></div>
        </div>

        <div class="paper-card" onclick="selectExam('2023')">
          <div class="paper-top"><span class="paper-tag">Official Cambridge</span><span style="font-size:12px;color:var(--ink-soft);font-weight:600">60 Questions</span></div>
          <h3>IMAT 2023 Past Paper</h3>
          <p>Complete official past paper with question-by-question solutions.</p>
          <div class="paper-meta"><span>100 Minutes &middot; Real Scoring</span><span class="paper-cta">Start Paper <i class="fas fa-arrow-right"></i></span></div>
        </div>
      </div>
    </div>
  `;
}

function renderSetup() {
  const hasProgress = state.examQuestions.length > 0;
  return `
    <div style="max-width:640px;margin:0 auto;animation:fadeInUp .5s ease">
      <button class="btn-line" onclick="goBack()" style="margin-bottom:20px;padding:9px 18px;font-size:13px"><i class="fas fa-arrow-left"></i> All Past Papers</button>
      
      <div style="background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:34px;box-shadow:var(--sh-md);">
        <span style="font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l);background:var(--g900);padding:4px 12px;border-radius:99px;">IMAT ${state.selectedExamId}</span>
        <h2 style="font-size:2rem;margin:14px 0 8px;">Official Past Paper Setup</h2>
        <p style="color:var(--ink-soft);font-size:14px;margin-bottom:24px;">Simulate real exam conditions: 60 questions across all subjects in 100 minutes.</p>
        
        <div style="background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:18px 22px;display:flex;flex-direction:column;gap:12px;font-size:14px;margin-bottom:24px;">
          <div style="display:flex;justify-content:space-between;"><span><b>Duration:</b></span> <span>100 Minutes</span></div>
          <div style="display:flex;justify-content:space-between;"><span><b>Questions:</b></span> <span>60 Official Questions</span></div>
          <div style="display:flex;justify-content:space-between;"><span><b>Scoring:</b></span> <span><b style="color:var(--ok)">+1.5</b> / <b style="color:var(--bad)">−0.4</b> / 0</span></div>
        </div>

        <button class="btn btn-primary" onclick="startExam()" style="width:100%;font-size:16px;padding:15px">Start Past Paper ${state.selectedExamId} <i class="fas fa-arrow-right"></i></button>
      </div>
    </div>
  `;
}

function renderExam() {
  const q = state.examQuestions[state.currentQuestion];
  const answer = state.answers[state.currentQuestion];
  const isWarning = state.timeRemaining < 300;
  const L = ['A','B','C','D','E'];

  return `
    <div style="max-width:860px;margin:0 auto;animation:fadeInUp .4s ease">
      <div class="exam-hud">
        <div>
          <div class="hud-title">IMAT ${state.selectedExamId} Past Paper</div>
          <div class="hud-progress">${Object.keys(state.answers).length} / ${state.examQuestions.length} answered</div>
        </div>
        <div class="timer-chip ${isWarning?'warning':''}"><i class="fas fa-clock" style="font-size:18px"></i> <span class="timer-val">${formatTime(state.timeRemaining)}</span></div>
      </div>

      <div class="q-box">
        <div class="q-sub-bar">
          <span>${q.section || 'Official Section'} &middot; ${q.subjectName || ''}</span>
          <span>Question ${state.currentQuestion + 1} of ${state.examQuestions.length}</span>
        </div>
        ${q.passage ? `<div class="q-passage">${q.passage}</div>` : ''}
        <div class="q-text">${q.question}</div>
        
        <div class="q-opts">
          ${q.options.map((opt, i) => `
            <button class="q-opt ${answer === i ? 'selected' : ''}" onclick="selectAnswer(${state.currentQuestion}, ${i})">
              <span class="q-opt-letter">${L[i]}</span>
              <span>${opt}</span>
            </button>
          `).join('')}
        </div>
      </div>

      <div class="q-nav-bar">
        <button class="btn-danger-line" onclick="quitExam()"><i class="fas fa-times"></i> Quit</button>
        <div style="display:flex;gap:10px">
          <button class="btn-line" onclick="prevQuestion()" ${state.currentQuestion === 0 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i> Previous</button>
          ${state.currentQuestion < state.examQuestions.length - 1 
            ? `<button class="btn btn-primary" onclick="nextQuestion()">Next <i class="fas fa-chevron-right"></i></button>`
            : `<button class="btn btn-primary" onclick="submitExam()" style="background:var(--ok)"><i class="fas fa-check-circle"></i> Submit Exam</button>`
          }
        </div>
      </div>

      <div class="nav-grid-box">
        <div class="nav-grid-title">Question Navigator</div>
        <div class="nav-pills">
          ${state.examQuestions.map((qi, i) => {
            let cls = '';
            if (i === state.currentQuestion) cls = 'current';
            else if (state.answers[i] !== undefined) cls = 'answered';
            return `<div class="nav-pill ${cls}" onclick="jumpTo(${i})">${i + 1}</div>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderResults() {
  const score = calculateScore();
  const total = state.examQuestions.length;
  const pct = Math.round((score.correct / total) * 100);

  return `
    <div class="results-card" style="animation:fadeInUp .5s ease">
      <span style="font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l);background:var(--g900);padding:5px 14px;border-radius:99px;">Simulation Complete</span>
      <div class="res-score">${score.score} <span>/ 90.0</span></div>
      <p style="color:var(--ink-soft);font-size:14.5px;">Official IMAT score for Paper ${state.selectedExamId}</p>

      <div class="res-kpi-grid">
        <div class="res-kpi"><b style="color:var(--ok)">${score.correct}</b><span>Correct (+1.5)</span></div>
        <div class="res-kpi"><b style="color:var(--bad)">${score.wrong}</b><span>Incorrect (−0.4)</span></div>
        <div class="res-kpi"><b>${pct}%</b><span>Accuracy</span></div>
      </div>

      <div style="display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="startReview()"><i class="fas fa-search"></i> Review All Questions</button>
        <button class="btn-line" onclick="goBack()"><i class="fas fa-rotate-right"></i> Back to Past Papers</button>
      </div>

      <div class="breakdown-list">
        ${state.examQuestions.map((q, i) => {
          const isCorrect = state.answers[i] === q.correct;
          const isAnswered = state.answers[i] !== undefined;
          let iconCls = 'skip', icon = '&mdash;', label = 'Unanswered';
          if (isAnswered && isCorrect) { iconCls = 'ok'; icon = '&#10003;'; label = 'Correct'; }
          else if (isAnswered) { iconCls = 'fail'; icon = '&#10007;'; label = 'Incorrect'; }
          return `
            <div class="bd-row" onclick="jumpTo(${i});startReview();" style="cursor:pointer">
              <div class="bd-icon ${iconCls}">${icon}</div>
              <div style="font-weight:700;width:38px">Q${i+1}</div>
              <div style="flex:1"><b>${q.subjectName || ''}</b> &middot; <small>${q.section || ''}</small></div>
              <div style="font-weight:700">${label}</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderReview() {
  const q = state.examQuestions[state.currentQuestion];
  const answer = state.answers[state.currentQuestion];
  const L = ['A','B','C','D','E'];

  return `
    <div style="max-width:860px;margin:0 auto;animation:fadeInUp .4s ease">
      <div class="exam-hud">
        <div>
          <div class="hud-title">Review Mode &middot; Paper ${state.selectedExamId}</div>
          <div class="hud-progress">Question ${state.currentQuestion + 1} of ${state.examQuestions.length}</div>
        </div>
        <button class="btn-line" onclick="state.view='results';render();" style="padding:8px 16px;font-size:13px"><i class="fas fa-arrow-left"></i> Results</button>
      </div>

      <div class="q-box">
        <div class="q-sub-bar">
          <span>${q.section || ''} &middot; ${q.subjectName || ''}</span>
          <span>Official Solution</span>
        </div>
        ${q.passage ? `<div class="q-passage">${q.passage}</div>` : ''}
        <div class="q-text">${q.question}</div>
        
        <div class="q-opts">
          ${q.options.map((opt, i) => {
            let cls = '';
            if (i === q.correct) cls = 'correct';
            else if (i === answer) cls = 'wrong';
            return `
              <button class="q-opt ${cls}" disabled>
                <span class="q-opt-letter">${L[i]}</span>
                <span>${opt}</span>
              </button>
            `;
          }).join('')}
        </div>

        <div style="margin-top:24px;padding:20px;border-radius:16px;background:var(--cream-2);border:1px solid var(--line);">
          <div style="font-weight:700;margin-bottom:8px;color:${answer === q.correct ? 'var(--ok)' : 'var(--bad)'}">
            ${answer === q.correct ? '&#10003; Correct Answer' : '&#10007; Incorrect'}
          </div>
          <div style="font-size:14.5px;line-height:1.6;color:var(--ink);">${q.solution || q.explanation || 'Solution available in answer key.'}</div>
        </div>
      </div>

      <div class="q-nav-bar">
        <button class="btn-line" onclick="prevQuestion()" ${state.currentQuestion === 0 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i> Previous</button>
        <button class="btn-line" onclick="nextQuestion()" ${state.currentQuestion === state.examQuestions.length - 1 ? 'disabled' : ''}>Next <i class="fas fa-chevron-right"></i></button>
      </div>

      <div class="nav-grid-box">
        <div class="nav-grid-title">Jump to Question</div>
        <div class="nav-pills">
          ${state.examQuestions.map((qi, i) => {
            let cls = '';
            if (i === state.currentQuestion) cls = 'current';
            else if (state.answers[i] === qi.correct) cls = 'answered';
            return `<div class="nav-pill ${cls}" onclick="jumpTo(${i})">${i + 1}</div>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

render();

})();
</script>
</body>
</html>
