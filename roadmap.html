<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMAT Test — ImatPath</title>
<meta name="description" content="Get your personalized IMAT Test. Take the diagnostic test and receive a week-by-week study plan tailored to your weak subjects.">
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="shared.css">
<style>
.roadmap-container { max-width:800px; margin:0 auto; padding:100px 20px 60px; }

.rm-progress { display:flex; gap:4px; margin-bottom:28px; }
.rm-prog-bar { flex:1; height:4px; border-radius:2px; background:var(--stone-3); transition:background .3s; }
.rm-prog-bar.done { background:var(--teal); }
.rm-prog-bar.current { background:var(--teal); opacity:0.5; }

.rm-question { font-size:1.15rem; font-weight:700; color:var(--ink); margin-bottom:20px; letter-spacing:-0.3px; line-height: 1.5; }
.rm-options { display:flex; flex-direction:column; gap:8px; margin-bottom:24px; }
.rm-opt {
  display:flex; align-items:center; gap:12px; padding:14px 18px;
  border:1.5px solid var(--stone-3); border-radius:11px; background:var(--white);
  cursor:pointer; transition:all .18s; font-size:0.88rem; color:var(--ink-2); font-weight:500;
}
.rm-opt:hover { border-color:var(--teal); }
.rm-opt.selected { border-color:var(--teal); background:var(--teal-faint); color:var(--teal-2); }
.rm-opt-dot {
  width:18px; height:18px; border-radius:50%; border:2px solid var(--stone-4);
  flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .18s;
}
.rm-opt.selected .rm-opt-dot { border-color:var(--teal); background:var(--teal); }
.rm-opt.selected .rm-opt-dot::after { content:''; width:6px; height:6px; border-radius:50%; background:white; }
.rm-opt.multi .rm-opt-dot { border-radius:5px; }
.rm-opt.multi.selected .rm-opt-dot::after { content:'\2713'; color:white; font-size:11px; font-weight:700; width:auto; height:auto; border-radius:0; background:none; }

.rm-nav { display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
.rm-back {
  padding:10px 20px; border-radius:9px; border:1.5px solid var(--stone-3); background:transparent;
  color:var(--ink-3); font-family:'Plus Jakarta Sans',sans-serif; font-size:0.85rem; font-weight:600;
  cursor:pointer; transition:border-color .18s, color .18s;
}
.rm-back:hover { border-color:var(--ink-3); color:var(--ink-2); }
.rm-next {
  padding:10px 24px; border-radius:9px; border:none; background:var(--teal); color:var(--white);
  font-family:'Plus Jakarta Sans',sans-serif; font-size:0.85rem; font-weight:700;
  cursor:pointer; transition:background .18s;
}
.rm-next:hover { background:var(--teal-2); }
.rm-next:disabled { opacity:0.4; cursor:not-allowed; }

/* Roadmap result */
.roadmap-result { background:var(--white); border:1px solid var(--stone-3); border-radius:18px; padding:36px; margin-top:24px; }
.roadmap-result-header { text-align:center; margin-bottom:28px; }
.roadmap-result-check {
  width:56px; height:56px; border-radius:50%;
  background:var(--teal-pale); border:2px solid var(--teal);
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 16px;
}
.roadmap-result-check i { font-size:1.3rem; color:var(--teal); }
.roadmap-result-title { font-size:1.15rem; font-weight:800; color:var(--ink); letter-spacing:-0.5px; margin-bottom:8px; }
.roadmap-result-sub { font-size:0.88rem; color:var(--ink-3); line-height:1.65; max-width:500px; margin:0 auto; }

.rm-summary { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px; }
.rm-summary-item { padding:14px 16px; background:var(--stone-2); border-radius:10px; text-align: center; }
.rm-summary-label { font-size:0.68rem; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; color:var(--ink-3); margin-bottom:4px; }
.rm-summary-value { font-size:0.85rem; font-weight:600; color:var(--ink); }

/* Week plan */
.plan-section { margin-top:32px; }
.plan-week-block { margin-bottom: 24px; background: var(--stone); border: 1px solid var(--stone-3); border-radius: 12px; padding: 20px; }
.plan-week-title { font-size:1.05rem; font-weight:800; color:var(--ink); margin-bottom:16px; border-bottom:2px solid var(--stone-3); padding-bottom:8px; }

.chapter-row { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--stone-3); gap:16px; }
.chapter-row:last-child { border-bottom:none; padding-bottom:0; }
.chapter-info { flex:1; }
.chapter-subj { font-size:0.7rem; font-weight:700; text-transform:uppercase; color:var(--teal); letter-spacing:0.5px; margin-bottom:4px; }
.chapter-name { font-size:0.95rem; font-weight:600; color:var(--ink); }
.chapter-meta { font-size:0.8rem; color:var(--ink-3); margin-top:4px; }
.chapter-meta i { margin-right:4px; }

.chapter-actions { display:flex; gap:12px; align-items:center; }
.checkbox-wrap { display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
.checkbox-wrap input { display:none; }
.checkbox-custom { width:20px; height:20px; border:2px solid var(--stone-4); border-radius:6px; display:flex; align-items:center; justify-content:center; transition:all 0.2s; background:white; }
.checkbox-wrap input:checked + .checkbox-custom { background:var(--teal); border-color:var(--teal); }
.checkbox-wrap input:checked + .checkbox-custom::after { content:'\2713'; color:white; font-size:12px; font-weight:bold; }
.checkbox-label { font-size:0.8rem; font-weight:600; color:var(--ink-2); }
.mastered-badge { display:inline-flex; align-items:center; gap:4px; padding:4px 8px; background:var(--teal-pale); color:var(--teal-2); border-radius:20px; font-size:0.75rem; font-weight:700; }

.btn-practice { padding:8px 16px; border-radius:8px; border:none; background:var(--teal); color:white; font-size:0.8rem; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
.btn-practice:hover { background:var(--teal-2); }

.plan-banner { padding:12px 16px; background:var(--teal-faint); border-radius:10px; border:1px solid rgba(13,148,136,0.2); font-size:0.85rem; color:var(--teal-2); font-weight:500; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
.plan-banner i { font-size:1.1rem; }

@keyframes fadeUp { from{opacity:0;transform:translateY(18px);} to{opacity:1;transform:translateY(0);} }
.fade-in { animation: fadeUp .4s ease both; }

@media(max-width:768px){
  .chapter-row { flex-direction:column; align-items:flex-start; }
  .chapter-actions { width:100%; justify-content:space-between; margin-top:12px; flex-wrap:wrap; }
  .rm-summary { grid-template-columns:1fr; }
}
</style>
<link rel="stylesheet" href="dark-mode.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="auth-guard.js"></script>
<script src="questions-data.js"></script>
</head>
<body>

<nav>
  <a class="logo" href="dashboard.html">Imat<span>Path</span></a>
  <div class="nav-right"></div>
</nav>

<div class="roadmap-container" id="app"></div>

<script>
// State
let state = {
  step: 1,
  answers: {},
  diagQuestions: [],
  diagAnswers: {}
};

const rmSteps = [
  {id: 'bg', question:"What is your academic background?", options:[
    {val:'science',text:'Studying science (Biology, Chemistry, etc.)'},
    {val:'nonscience',text:'Studying non-science subjects'},
    {val:'gap',text:'Gap year or self-studying'},
    {val:'graduate',text:'University graduate'}
  ]},
  {id: 'hrs', question:"How many hours per week can you realistically study?", options:[
    {val:'lt10',text:'Less than 10 hours'},
    {val:'10to20',text:'10 – 20 hours'},
    {val:'20to30',text:'20 – 30 hours'},
    {val:'30plus',text:'30+ hours'}
  ]},
  {id: 'diag_intro', question:"Diagnostic Test", intro:true, text: "Before we build your personalized IMAT Test, you need to take a short diagnostic test. This will assess your current level across all IMAT subjects so we can allocate more time to your weak areas. You will face 15 questions."}
];

function initDiagnosticTest() {
  state.diagQuestions = [];
  // Pick 3 random questions from biology, chemistry, physics, math, critical-thinking
  const targetSubjects = ['biology', 'chemistry', 'physics', 'math', 'critical-thinking'];
  targetSubjects.forEach(subId => {
    const sub = subjects.find(s => s.id === subId);
    if(sub) {
      let allQs = [];
      sub.chapters.forEach(ch => {
        ch.questions.forEach((q, idx) => {
          allQs.push({...q, subjectId: sub.id, chapterId: ch.id, origIdx: idx});
        });
      });
      allQs.sort(() => 0.5 - Math.random());
      state.diagQuestions.push(...allQs.slice(0, 3));
    }
  });
  // Shuffle final test
  state.diagQuestions.sort(() => 0.5 - Math.random());
}

function loadState() {
  const user = JSON.parse(localStorage.getItem('imatpath_user') || '{}');
  if (user.roadmapGenerated && user.roadmapAnswers) {
    state.step = 'result';
    state.answers = user.roadmapAnswers;
  }
}
loadState();

function saveToUser() {
  const user = JSON.parse(localStorage.getItem('imatpath_user') || '{}');
  user.roadmapGenerated = true;
  user.roadmapAnswers = state.answers;
  
  // Calculate diag scores
  let scores = { 'biology': 0, 'chemistry': 0, 'physics': 0, 'math': 0, 'critical-thinking': 0 };
  let counts = { 'biology': 0, 'chemistry': 0, 'physics': 0, 'math': 0, 'critical-thinking': 0 };
  state.diagQuestions.forEach((q, i) => {
    counts[q.subjectId]++;
    if(state.diagAnswers[i] === q.correct) scores[q.subjectId]++;
  });
  user.diagnosticScores = {};
  Object.keys(scores).forEach(k => {
    user.diagnosticScores[k] = counts[k] > 0 ? (scores[k] / counts[k]) : 0;
  });
  
  localStorage.setItem('imatpath_user', JSON.stringify(user));
}

function selectOpt(step, val) {
  state.answers[step] = val;
  render();
}

function selectDiagAns(qIdx, ansIdx) {
  state.diagAnswers[qIdx] = ansIdx;
  render();
}

function goBack() {
  if(typeof state.step === 'number') {
    state.step--;
    render();
  } else if(state.step.startsWith('diag_')) {
    let qIdx = parseInt(state.step.split('_')[1]);
    if(qIdx === 0) state.step = 3;
    else state.step = `diag_${qIdx-1}`;
    render();
  }
}

function goNext() {
  if (state.step === 1 || state.step === 2) {
    state.step++;
    if(state.step === 3) initDiagnosticTest();
    render();
  } else if (state.step === 3) {
    state.step = 'diag_0';
    render();
  } else if (typeof state.step === 'string' && state.step.startsWith('diag_')) {
    let qIdx = parseInt(state.step.split('_')[1]);
    if(qIdx < state.diagQuestions.length - 1) {
      state.step = `diag_${qIdx+1}`;
    } else {
      saveToUser();
      state.step = 'result';
    }
    render();
  }
}

function resetRoadmap() { state.step = 1; state.answers = {}; state.diagAnswers = {}; render(); }

function toggleReviewed(chapterId, checkbox) {
  const user = JSON.parse(localStorage.getItem('imatpath_user') || '{}');
  if(!user.roadmapReviewed) user.roadmapReviewed = {};
  user.roadmapReviewed[chapterId] = checkbox.checked;
  localStorage.setItem('imatpath_user', JSON.stringify(user));
}

function getQbStats() {
  const qbRaw = localStorage.getItem('imatpath_qb');
  if(!qbRaw) return {};
  const qb = JSON.parse(qbRaw);
  let stats = {}; // chapterId -> { total, correct }
  if(qb.revealed) {
    Object.keys(qb.revealed).forEach(k => {
      // k is like 'biology-3' -> subjectId-qIdx
      const parts = k.split('-');
      if(parts.length >= 2) {
        const subId = parts[0];
        const qIdx = parseInt(parts[1]);
        const sub = subjects.find(s => s.id === subId);
        if(sub) {
          let currentIdx = 0;
          sub.chapters.forEach(ch => {
            if(qIdx >= currentIdx && qIdx < currentIdx + ch.questions.length) {
              if(!stats[ch.id]) stats[ch.id] = { total: 0, correct: 0 };
              stats[ch.id].total++;
              if(qb.answers && qb.answers[k] === ch.questions[qIdx - currentIdx].correct) {
                stats[ch.id].correct++;
              }
            }
            currentIdx += ch.questions.length;
          });
        }
      }
    });
  }
  return stats;
}

function generateChapterPlan() {
  const user = JSON.parse(localStorage.getItem('imatpath_user') || '{}');
  const diagScores = user.diagnosticScores || { 'biology': 0.5, 'chemistry': 0.5, 'physics': 0.5, 'math': 0.5, 'critical-thinking': 0.5 };
  
  // Weights based on IMAT format
  const subWeights = { 'biology': 1.5, 'chemistry': 1.2, 'physics': 1.0, 'math': 1.0, 'critical-thinking': 0.8, 'problem-solving': 0.8, 'data-analysis': 0.8, 'general-knowledge': 0.4 };
  
  // Calculate days remaining
  const examDate = new Date('2026-09-29T15:00:00+02:00');
  let daysLeft = Math.ceil((examDate - new Date()) / (1000*60*60*24));
  if(daysLeft < 14) daysLeft = 14; // minimum 2 weeks for planner logic
  
  // Gather chapters
  let planChapters = [];
  subjects.forEach(sub => {
    sub.chapters.forEach(ch => {
      const score = diagScores[sub.id] !== undefined ? diagScores[sub.id] : 0.5;
      const weight = subWeights[sub.id] || 1.0;
      let allocFactor = weight * (1.2 - score); // Base factor
      planChapters.push({
        id: ch.id,
        name: ch.name,
        subjectId: sub.id,
        subjectName: sub.name,
        allocFactor: allocFactor,
        days: 0,
        mastered: false,
        qbAccuracy: 0,
        qbTotal: 0
      });
    });
  });
  
  // Read QB stats to find mastered chapters
  const qbStats = getQbStats();
  let masteredCount = 0;
  planChapters.forEach(ch => {
    if(qbStats[ch.id]) {
      ch.qbTotal = qbStats[ch.id].total;
      ch.qbAccuracy = ch.qbTotal > 0 ? (qbStats[ch.id].correct / ch.qbTotal) : 0;
      if(ch.qbTotal >= 5 && ch.qbAccuracy >= 0.75) {
        ch.mastered = true;
        ch.allocFactor = 0; // Don't allocate days if mastered
        masteredCount++;
      }
    }
  });
  
  // Allocate days
  let totalFactor = planChapters.reduce((sum, ch) => sum + ch.allocFactor, 0);
  planChapters.forEach(ch => {
    if(!ch.mastered) {
      ch.days = Math.max(1, Math.round(daysLeft * (ch.allocFactor / totalFactor)));
    }
  });
  
  // Sort by priority (allocate weakest first)
  planChapters.sort((a,b) => b.allocFactor - a.allocFactor);
  
  // Group into weeks
  let weeks = [];
  let currentWeek = { num: 1, chapters: [], daysAccum: 0 };
  
  planChapters.forEach(ch => {
    if(ch.mastered) return; // Hide or push to bottom? Let's just skip them from the schedule but we can list them at the bottom.
    if(currentWeek.daysAccum + ch.days > 7 && currentWeek.chapters.length > 0) {
      weeks.push(currentWeek);
      currentWeek = { num: weeks.length + 1, chapters: [], daysAccum: 0 };
    }
    currentWeek.chapters.push(ch);
    currentWeek.daysAccum += ch.days;
  });
  if(currentWeek.chapters.length > 0) weeks.push(currentWeek);
  
  return { weeks, planChapters, masteredCount, daysLeft };
}

function render() {
  const app = document.getElementById('app');

  if (typeof state.step === 'number' && state.step <= 3) {
    const s = rmSteps[state.step - 1];
    let h = '<div class="fade-in">';
    h += '<div style="margin-bottom: 30px;"><a href="dashboard.html" class="btn-secondary" style="font-size: 0.95rem;"><i class="fas fa-arrow-left"></i> Dashboard</a></div>';
    h += '<div class="rm-progress">';
    for (let i = 1; i <= 3; i++) h += `<div class="rm-prog-bar ${i < state.step ? 'done' : i === state.step ? 'current' : ''}"></div>`;
    h += '</div>';
    h += `<div class="rm-question">${s.question}</div>`;
    
    if(s.intro) {
      h += `<p style="color:var(--ink-3); line-height:1.6; margin-bottom:24px;">${s.text}</p>`;
    } else {
      h += '<div class="rm-options">';
      s.options.forEach(o => {
        const sel = state.answers[state.step] === o.val ? 'selected' : '';
        h += `<div class="rm-opt ${sel}" onclick="selectOpt(${state.step},'${o.val}')"><div class="rm-opt-dot"></div>${o.text}</div>`;
      });
      h += '</div>';
    }
    
    h += '<div class="rm-nav">';
    h += state.step > 1 ? '<button class="rm-back" onclick="goBack()">Back</button>' : '<div></div>';
    const canNext = s.intro ? true : !!state.answers[state.step];
    h += `<button class="rm-next" onclick="goNext()" ${canNext ? '' : 'disabled'}>${s.intro ? 'Start Diagnostic' : 'Next'}</button>`;
    h += '</div></div>';
    app.innerHTML = h;

  } else if (typeof state.step === 'string' && state.step.startsWith('diag_')) {
    let qIdx = parseInt(state.step.split('_')[1]);
    const q = state.diagQuestions[qIdx];
    let h = '<div class="fade-in">';
    h += `<div style="font-size:0.8rem; font-weight:700; color:var(--teal); margin-bottom:8px; text-transform:uppercase;">Diagnostic Test • Q${qIdx+1}/15</div>`;
    h += `<div class="rm-question" style="font-size:1.05rem;">${q.passage ? '<div style="font-size:0.9rem; font-weight:400; color:var(--ink-3); margin-bottom:12px; background:var(--stone-2); padding:12px; border-radius:8px;">'+q.passage+'</div>' : ''}${q.question}</div>`;
    h += '<div class="rm-options">';
    q.options.forEach((opt, idx) => {
      const sel = state.diagAnswers[qIdx] === idx ? 'selected' : '';
      h += `<div class="rm-opt ${sel}" onclick="selectDiagAns(${qIdx},${idx})"><div class="rm-opt-dot"></div>${opt}</div>`;
    });
    h += '</div>';
    h += '<div class="rm-nav">';
    h += '<button class="rm-back" onclick="goBack()">Back</button>';
    const canNext = state.diagAnswers[qIdx] !== undefined;
    h += `<button class="rm-next" onclick="goNext()" ${canNext ? '' : 'disabled'}>${qIdx === 14 ? 'Generate Plan' : 'Next Question'}</button>`;
    h += '</div></div>';
    app.innerHTML = h;

  } else {
    // Show roadmap result
    const { weeks, planChapters, masteredCount, daysLeft } = generateChapterPlan();
    const user = JSON.parse(localStorage.getItem('imatpath_user') || '{}');
    const reviewed = user.roadmapReviewed || {};
    
    let h = '<div class="fade-in">';
    h += '<div style="margin-bottom: 30px;"><a href="dashboard.html" class="btn-practice" style="font-size: 0.95rem; display: inline-flex; align-items: center; gap: 8px;"><i class="fas fa-arrow-left"></i> Back to Dashboard</a></div>';
    h += '<div class="roadmap-result" style="padding:24px;">';

    h += '<div class="roadmap-result-header">';
    h += '<div class="roadmap-result-check"><i class="fas fa-calendar-check"></i></div>';
    h += '<div class="roadmap-result-title">Your Chapter-by-Chapter Plan</div>';
    h += `<div class="roadmap-result-sub">${daysLeft} days until IMAT 2026. This plan dynamically adapts to your diagnostic and practice scores.</div>`;
    h += '</div>';
    
    if(masteredCount > 0) {
      h += `<div class="plan-banner"><i class="fas fa-magic"></i><span>Adaptive Engine: You mastered ${masteredCount} chapter${masteredCount>1?'s':''} in practice. We've dynamically redistributed their study time to your weaker areas!</span></div>`;
    }

    // Week-by-week plan
    h += '<div class="plan-section">';
    weeks.forEach(w => {
      h += `<div class="plan-week-block">`;
      h += `<div class="plan-week-title">Week ${w.num} <span style="font-size:0.8rem;color:var(--ink-3);font-weight:500;float:right;">~${w.daysAccum} days of material</span></div>`;
      
      w.chapters.forEach(ch => {
        h += `<div class="chapter-row">`;
        h += `<div class="chapter-info">`;
        h += `<div class="chapter-subj">${ch.subjectName} &middot; ${ch.days} days allocated</div>`;
        h += `<div class="chapter-name">${ch.name}</div>`;
        if(ch.qbTotal > 0) {
           const pct = Math.round(ch.qbAccuracy * 100);
           h += `<div class="chapter-meta"><i class="fas fa-chart-bar"></i> Practice Accuracy: <strong style="color:${pct>=75?'var(--teal)':'var(--ink)'}">${pct}%</strong> (${ch.qbTotal} done)</div>`;
        }
        h += `</div>`;
        
        h += `<div class="chapter-actions">`;
        const isRev = reviewed[ch.id] ? 'checked' : '';
        h += `<label class="checkbox-wrap">
                <input type="checkbox" onchange="toggleReviewed('${ch.id}', this)" ${isRev}>
                <div class="checkbox-custom"></div>
                <span class="checkbox-label">Reviewed</span>
              </label>`;
        
        if(ch.mastered) {
          h += `<div class="mastered-badge"><i class="fas fa-star"></i> Mastered</div>`;
        } else {
          h += `<a href="question-bank.html?chapter=${ch.id}" class="btn-practice"><i class="fas fa-play" style="font-size:0.7rem;margin-right:6px;"></i> Practice</a>`;
        }
        h += `</div>`;
        h += `</div>`;
      });
      
      h += `</div>`;
    });
    h += '</div>';

    // Actions
    h += '<div style="margin-top:24px; text-align:center;">';
    h += '<button class="btn-secondary" onclick="resetRoadmap()"><i class="fas fa-redo" style="font-size:0.7rem;"></i> Retake Diagnostic Test</button>';
    h += '</div>';

    h += '</div></div>';
    app.innerHTML = h;
  }
}

render();
</script>
<script src="dark-mode.js"></script>
</body>
</html>
